    <nav class="menu-nav" aria-label="Navegação principal">

        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
        class="menu-item"
      >
        <ion-icon name="home-outline"></ion-icon>
        <ion-label>Home</ion-label>
      </a>

      <a

        routerLinkActive="active"
        class="menu-item"

      <a

        routerLinkActive="active"
